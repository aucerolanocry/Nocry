name: Prints das telas (prévia)

# Gera uma build de PRÉVIA (sem key, nunca publicada), abre cada tela no emulador,
# tira print e guarda tudo no branch "prints" pra conferir o visual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar a prévia
        env:
          NOCRY_PREVIEW: "1"
          NOCRY_VERSION: "0.0.0-previa"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Nocry.apk

      - name: ImageMagick
        run: sudo apt-get install -y imagemagick > /dev/null 2>&1 || true

      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prints.sh dist/Nocry.apk prints

      - name: Guardar no branch prints
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd prints
          git init -q
          git checkout -q -b prints
          git config user.name "prints-bot"
          git config user.email "prints-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "prints ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prints
