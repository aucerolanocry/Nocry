name: Publicar Workers do Nocry

on:
  workflow_dispatch: {}

jobs:
  deploy-nocry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # chaves do servidor da IA, todas opcionais (cada uma só vai pro servidor se existir aqui nos segredos):
      #  - GROQ_API_KEY: escuta (voz) rápida e cérebro de reserva, grátis
      #  - GEMINI_API_KEY: cérebro principal, grátis
      #  - ELEVENLABS_API_KEY / ELEVENLABS_VOZ: voz anime da IA
      # Aqui só aparece o NOME de cada chave encontrada, nunca o valor.
      - name: Conferir as chaves da IA e da voz
        env:
          V_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          V_VOZ: ${{ secrets.ELEVENLABS_VOZ }}
          G_KEY: ${{ secrets.GROQ_API_KEY }}
          M_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          L=""
          if [ -n "$G_KEY" ]; then L="$L GROQ_API_KEY"; echo "Groq: chave encontrada"; else echo "Groq: sem chave"; fi
          if [ -n "$M_KEY" ]; then L="$L GEMINI_API_KEY"; echo "Gemini: chave encontrada"; else echo "Gemini: sem chave"; fi
          if [ -n "$V_KEY" ]; then L="$L ELEVENLABS_API_KEY"; echo "voz da nuvem: chave encontrada"; else echo "voz da nuvem: sem chave (a IA usa a voz do celular)"; fi
          if [ -n "$V_VOZ" ]; then L="$L ELEVENLABS_VOZ"; echo "voz da nuvem: voz escolhida encontrada"; fi
          {
            echo "SEGREDOS<<FIM_DOS_SEGREDOS"
            for s in $L; do echo "$s"; done
            echo "FIM_DOS_SEGREDOS"
          } >> "$GITHUB_ENV"
          if [ -n "$L" ]; then echo "TEM_SEGREDOS=1" >> "$GITHUB_ENV"; fi
      - name: Publicar worker "nocry" (com as chaves)
        if: env.TEM_SEGREDOS == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "worker/nocry"
          command: deploy
          secrets: ${{ env.SEGREDOS }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOZ: ${{ secrets.ELEVENLABS_VOZ }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Publicar worker "nocry"
        if: env.TEM_SEGREDOS != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "worker/nocry"
          command: deploy

  deploy-nocry-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a chave do GitHub que o servidor de download usa pra pegar as pastas: testa as que estão guardadas
      # aqui (só mostra se funciona, nunca o valor) e, se uma funcionar, troca a do servidor por ela
      - name: Conferir chave do GitHub do servidor de download
        env:
          T_NOVO: ${{ secrets.FF_GITHUB_TOKEN }}
          T_APK: ${{ secrets.GH_TOKEN_DOWNLOAD }}
        run: |
          teste() { if [ -z "$1" ]; then echo "nao-existe"; else curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $1" "https://api.github.com/repos/aucerolanocry/ff-installer/releases?per_page=1"; fi; }
          A=$(teste "$T_NOVO"); B=$(teste "$T_APK")
          echo "FF_GITHUB_TOKEN: $A · GH_TOKEN_DOWNLOAD: $B"
          if [ "$A" = "200" ]; then echo "TOKEN_ESCOLHIDO=$T_NOVO" >> "$GITHUB_ENV"; echo "vai usar FF_GITHUB_TOKEN"
          elif [ "$B" = "200" ]; then echo "TOKEN_ESCOLHIDO=$T_APK" >> "$GITHUB_ENV"; echo "vai usar GH_TOKEN_DOWNLOAD"
          else echo "nenhuma chave guardada funciona: o servidor continua com a que já tem"; fi
      - name: Publicar worker "nocry-download" (com a chave nova do GitHub)
        if: env.TOKEN_ESCOLHIDO != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "worker/nocry-download"
          command: deploy
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ env.TOKEN_ESCOLHIDO }}
      - name: Publicar worker "nocry-download"
        if: env.TOKEN_ESCOLHIDO == ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "worker/nocry-download"
          command: deploy
