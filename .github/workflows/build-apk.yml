name: Gerar APK do Nocry

# Como usar:
#  - Criar uma tag "v1.0.0" (ou rodar manualmente em Actions > Run workflow)
#  - O APK sai em Releases como Nocry.apk e qualquer pessoa pode baixar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 1.0.0). Se publicar, cria a release v<versão>"
        required: true
        default: "1.0.0"
      publicar:
        description: "Publicar em Releases?"
        type: boolean
        default: true
      rascunho:
        description: "Só pra mim: guardar como rascunho (não vira atualização pros usuários)"
        type: boolean
        default: false
      prints:
        description: "Só tirar print das telas (prévia no emulador, não gera APK pra ninguém)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event.inputs.prints != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Descobrir versão
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.versao }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          IFS=. read -r MA MI PA <<< "$V"
          MA=${MA:-1}; MI=${MI:-0}; PA=${PA:-0}
          PA=${PA%%[^0-9]*}
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versão $V (code $CODE)"

      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nocry.jks"
            echo "NOCRY_KEYSTORE=$RUNNER_TEMP/nocry.jks" >> "$GITHUB_ENV"
            echo "Chave fixa encontrada."
          else
            echo "::warning::Sem KEYSTORE_B64 nos Secrets: o APK vai sair assinado com chave de teste e NÃO atualiza por cima de outra versão."
          fi

      - name: Compilar APK
        env:
          NOCRY_VERSION: ${{ steps.v.outputs.name }}
          NOCRY_VERSION_CODE: ${{ steps.v.outputs.code }}
          NOCRY_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          NOCRY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOCRY_KEY_PASS: ${{ secrets.KEY_PASS }}
          GH_TOKEN_DOWNLOAD: ${{ secrets.GH_TOKEN_DOWNLOAD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Nocry.apk
          ls -la dist

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Nocry-apk
          path: dist/Nocry.apk

      - name: Guardar como rascunho (só o dono vê)
        if: github.event.inputs.rascunho == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sniper-v${{ steps.v.outputs.name }}
        run: |
          gh release delete "$TAG" -y >/dev/null 2>&1 || true
          gh release create "$TAG" dist/Nocry.apk --draft --title "Nocry $TAG (só dono)" \
            --notes "Versão com o SNIPER. Rascunho: não aparece pros usuários e não vira atualização." --target "${GITHUB_SHA}"

      - name: Publicar em Releases
        if: github.event_name == 'push' || github.event.inputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.name }}
        run: |
          NOTAS="Baixe o **Nocry.apk**, instale e abra. No primeiro uso o app guia o pareamento do ADB (depuração sem fio)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Nocry.apk --clobber
          else
            gh release create "$TAG" dist/Nocry.apk --title "Nocry $TAG" --notes "$NOTAS" --target "${GITHUB_SHA}"
          fi

  prints:
    if: github.event.inputs.prints == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar a prévia
        env:
          NOCRY_PREVIEW: "1"
          NOCRY_VERSION: "0.0.0-previa"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Nocry.apk

      - name: ImageMagick
        run: sudo apt-get install -y imagemagick > /dev/null 2>&1 || true

      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prints.sh dist/Nocry.apk prints

      - name: Guardar no branch prints
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd prints
          git init -q
          git checkout -q -b prints
          git config user.name "prints-bot"
          git config user.email "prints-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "prints ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prints
