name: Gerar APK do Nocry

# Como usar:
#  - Criar uma tag "v1.0.0" (ou rodar manualmente em Actions > Run workflow)
#  - O APK sai em Releases como Nocry.apk e qualquer pessoa pode baixar.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 1.0.0). Se publicar, cria a release v<versão>"
        required: true
        default: "1.0.0"
      publicar:
        description: "Publicar em Releases?"
        type: boolean
        default: true
      rascunho:
        description: "Só pra mim: guardar como rascunho (não vira atualização pros usuários)"
        type: boolean
        default: false
      prints:
        description: "Só tirar print das telas (prévia no emulador, não gera APK pra ninguém)"
        type: boolean
        default: false
      so_dono:
        description: "Lançar só pro dono: aparece como atualização no app só pra key de dono (os outros continuam na versão pública)"
        type: boolean
        default: false
      ocultar:
        description: "Só esconder uma versão já lançada (ex.: v1.0.44): volta pra rascunho, some do app e do link"
        required: false
        default: ""
      mostrar:
        description: "Só lançar de novo uma versão escondida (ex.: v1.0.44): vira pública e aparece no app"
        required: false
        default: ""
      notas:
        description: "Novidades na página do lançamento (vazio = texto padrão)"
        required: false
        default: ""
      limpar:
        description: "Só apagar releases antigas: tags a MANTER, separadas por vírgula (ex.: v1.0.77). Vazio = não apaga nada"
        required: false
        default: ""
      limpar_confirmar:
        description: "Pra apagar de verdade, digite APAGAR (é irreversível)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    if: github.event.inputs.prints != 'true' && github.event.inputs.ocultar == '' && github.event.inputs.mostrar == '' && github.event.inputs.limpar == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Descobrir versão
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.versao }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          IFS=. read -r MA MI PA <<< "$V"
          MA=${MA:-1}; MI=${MI:-0}; PA=${PA:-0}
          PA=${PA%%[^0-9]*}
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versão $V (code $CODE)"

      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nocry.jks"
            echo "NOCRY_KEYSTORE=$RUNNER_TEMP/nocry.jks" >> "$GITHUB_ENV"
            echo "Chave fixa encontrada."
          else
            echo "::warning::Sem KEYSTORE_B64 nos Secrets: o APK vai sair assinado com chave de teste e NÃO atualiza por cima de outra versão."
          fi

      - name: Compilar APK
        env:
          NOCRY_VERSION: ${{ steps.v.outputs.name }}
          NOCRY_VERSION_CODE: ${{ steps.v.outputs.code }}
          NOCRY_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          NOCRY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NOCRY_KEY_PASS: ${{ secrets.KEY_PASS }}
          GH_TOKEN_DOWNLOAD: ${{ secrets.GH_TOKEN_DOWNLOAD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Nocry.apk
          ls -la dist

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Nocry-apk
          path: dist/Nocry.apk

      - name: Guardar como rascunho (só o dono vê)
        if: github.event.inputs.rascunho == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sniper-v${{ steps.v.outputs.name }}
        run: |
          gh release delete "$TAG" -y >/dev/null 2>&1 || true
          gh release create "$TAG" dist/Nocry.apk --draft --title "Nocry $TAG (só dono)" \
            --notes "Versão com o SNIPER. Rascunho: não aparece pros usuários e não vira atualização." --target "${GITHUB_SHA}"

      - name: Lançar só pro dono (pré-lançamento)
        if: github.event.inputs.so_dono == 'true' && github.event.inputs.publicar != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.name }}
        run: |
          # pré-lançamento nunca vira "latest": o app dos usuários (que segue /releases/latest) não vê.
          # Só o app com a key de dono procura também os pré-lançamentos.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Nocry.apk --clobber
            gh release edit "$TAG" --prerelease --draft=false
          else
            gh release create "$TAG" dist/Nocry.apk --prerelease --title "Nocry $TAG (só dono)" \
              --notes "Pré-lançamento: aparece como atualização só no app do dono. Pra todos: rode o workflow com mostrar=$TAG." --target "${GITHUB_SHA}"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,isDraft

      - name: Publicar em Releases
        if: github.event_name == 'push' || github.event.inputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.name }}
          NOTAS_IN: ${{ github.event.inputs.notas }}
        run: |
          PADRAO="Baixe o **Nocry.apk**, instale e abra. No primeiro uso o app guia o pareamento do ADB (depuração sem fio)."
          NOTAS="${NOTAS_IN:-$PADRAO}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Nocry.apk --clobber
            if [ -n "$NOTAS_IN" ]; then gh release edit "$TAG" --notes "$NOTAS"; fi
          else
            gh release create "$TAG" dist/Nocry.apk --title "Nocry $TAG" --notes "$NOTAS" --target "${GITHUB_SHA}"
          fi

  ocultar:
    if: github.event.inputs.ocultar != ''
    runs-on: ubuntu-latest
    steps:
      - name: Voltar a versão pra rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.ocultar }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft

  mostrar:
    if: github.event.inputs.mostrar != ''
    runs-on: ubuntu-latest
    steps:
      - name: Lançar a versão de novo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.mostrar }}
          NOTAS_IN: ${{ github.event.inputs.notas }}
        run: |
          # a página do pré-lançamento dizia "só no app do dono": troca pelas novidades (ou pelo texto padrão)
          PADRAO="Baixe o **Nocry.apk**, instale e abra. No primeiro uso o app guia o pareamento do ADB (depuração sem fio)."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --notes "${NOTAS_IN:-$PADRAO}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease

  # apaga TODAS as releases menos as listadas em "limpar" (roda pela sniper: o workflow separado
  # limpar-releases.yml so rodava se estivesse na main)
  limpar:
    if: github.event.inputs.limpar != ''
    runs-on: ubuntu-latest
    steps:
      - name: Conferir confirmação
        if: github.event.inputs.limpar_confirmar != 'APAGAR'
        run: |
          echo "Confirmação errada. Digite APAGAR no campo 'limpar_confirmar' pra rodar."
          exit 1

      - name: Apagar releases (menos as mantidas)
        env:
          GH_TOKEN: ${{ github.token }}
          MANTER: ${{ github.event.inputs.limpar }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          keep=",$(echo "$MANTER" | tr -d ' '),"
          echo "Mantendo: $keep"
          # 1) junta TODAS as releases (todas as páginas) antes de apagar, pra paginação não pular nada
          all="$(mktemp)"
          page=1
          while : ; do
            resp="$(gh api "repos/$REPO/releases?per_page=100&page=$page")"
            n="$(echo "$resp" | jq 'length')"
            [ "$n" -eq 0 ] && break
            echo "$resp" | jq -r '.[] | "\(.id)\t\(.tag_name)"' >> "$all"
            page=$((page+1))
          done
          echo "Encontradas $(wc -l < "$all" | tr -d ' ') releases."
          # segurança: se nenhuma das mantidas existe, não apaga nada (evita ficar sem versão nenhuma)
          achou=0
          while IFS="$(printf '\t')" read -r id tag; do
            echo "$keep" | grep -q ",$tag," && achou=1
          done < "$all"
          if [ "$achou" -ne 1 ]; then
            echo "Nenhuma das versões pra manter ($MANTER) existe. Não apaguei nada."
            exit 1
          fi
          # 2) apaga o resto (release e tag)
          apagadas=0
          while IFS="$(printf '\t')" read -r id tag; do
            [ -z "$id" ] && continue
            if echo "$keep" | grep -q ",$tag,"; then
              echo "MANTER  $tag"
            else
              if gh api -X DELETE "repos/$REPO/releases/$id"; then
                apagadas=$((apagadas+1))
                echo "apagada $tag"
                gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
              else
                echo "(falhou apagar $tag)"
              fi
            fi
          done < "$all"
          echo "Pronto. Apaguei $apagadas releases; mantive: $MANTER"

  prints:
    if: github.event.inputs.prints == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar a prévia
        env:
          NOCRY_PREVIEW: "1"
          NOCRY_VERSION: "0.0.0-previa"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Nocry.apk

      - name: ImageMagick
        run: sudo apt-get install -y imagemagick > /dev/null 2>&1 || true

      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prints.sh dist/Nocry.apk prints; bash scripts/estresse.sh prints

      - name: Guardar os prints
        uses: actions/upload-artifact@v4
        with:
          name: prints
          path: prints
          retention-days: 14
